apiVersion: apps/v1
kind: Deployment
metadata:
  name: full-accesorios-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: full-accesorios-frontend
  template:
    metadata:
      labels:
        app: full-accesorios-frontend
    spec:
      containers:
        - name: frontend
          image: proyecto_backend-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: full-accesorios-frontend
spec:
  type: LoadBalancer
  selector:
    app: full-accesorios-frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
      nodePort: 30080
